<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ohmypi gateway</title>
<style>
  :root {
    --bg: #0d1117; --bg-raised: #131a23; --bg-inset: #0a0e13;
    --border: #232c38; --border-soft: #1b2330;
    --fg: #e6edf3; --fg-muted: #9aa7b4; --fg-faint: #6b7683;
    --accent: #7ee787; --cyan: #79c0ff; --amber: #e3b341; --red: #ff7b72; --violet: #d2a8ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: .92rem; }
  a { color: var(--cyan); }
  button { background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: .35rem .7rem; cursor: pointer; font-size: .85rem; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #16321d; border-color: #2ea04366; color: var(--accent); }
  button.danger { color: var(--red); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { background: var(--bg-inset); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: .4rem .55rem; font-size: .88rem; }
  textarea { font-family: var(--mono); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--fg-muted); } .faint { color: var(--fg-faint); }
  .row { display: flex; gap: .5rem; align-items: center; }

  #app { display: grid; grid-template-columns: 270px 1fr; height: 100vh; }
  aside { background: var(--bg-inset); border-right: 1px solid var(--border-soft);
          display: flex; flex-direction: column; overflow: hidden; }
  aside header { padding: .8rem .9rem; border-bottom: 1px solid var(--border-soft); }
  aside .brand { font-family: var(--mono); font-weight: 700; }
  aside .brand span { color: var(--accent); }
  aside .scroll { overflow-y: auto; flex: 1; padding: .6rem; }
  .sect { margin-bottom: 1rem; }
  .sect h4 { margin: .3rem 0 .35rem; font-size: .7rem; text-transform: uppercase;
             letter-spacing: .08em; color: var(--fg-faint); }
  .item { padding: .45rem .55rem; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
          margin-bottom: .15rem; }
  .item:hover { background: var(--bg-raised); }
  .item.active { background: var(--bg-raised); border-color: var(--accent-dim, #2ea043); }
  .item .t { font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: .72rem; color: var(--fg-faint); font-family: var(--mono); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .35rem; }
  .dot.live { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
  .dot.dead { background: var(--red); }
  .dot.saved { background: var(--fg-faint); }

  main { display: flex; flex-direction: column; overflow: hidden; }
  nav.tabs { display: flex; gap: .2rem; padding: .5rem .8rem; border-bottom: 1px solid var(--border-soft);
             background: var(--bg-inset); }
  nav.tabs button { border: none; background: transparent; color: var(--fg-muted); border-radius: 6px; }
  nav.tabs button.active { background: var(--bg-raised); color: var(--fg); }
  .pane { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
  .pane.noscroll { overflow: hidden; display: flex; flex-direction: column; }

  /* chat */
  #chatlog { flex: 1; overflow-y: auto; padding: .5rem .2rem; }
  .msg { margin-bottom: .8rem; max-width: 62rem; }
  .msg .who { font-family: var(--mono); font-size: .7rem; color: var(--fg-faint); margin-bottom: .15rem; }
  .msg.user .who { color: var(--cyan); }
  .msg.assistant .who { color: var(--accent); }
  .msg .body { white-space: pre-wrap; line-height: 1.5; }
  .msg.tool .body { font-family: var(--mono); font-size: .78rem; color: var(--violet);
                    background: var(--bg-inset); border: 1px solid var(--border-soft);
                    border-radius: 6px; padding: .4rem .6rem; }
  .composer { border-top: 1px solid var(--border-soft); padding: .7rem .8rem; display: flex; gap: .5rem; }
  .composer textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 160px; }
  .streaming { color: var(--amber); font-size: .75rem; font-family: var(--mono); }

  pre.raw { background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 8px;
            padding: .8rem; overflow-x: auto; font-size: .78rem; font-family: var(--mono);
            white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: .2rem .8rem; font-size: .84rem; }
  .kv dt { color: var(--fg-faint); font-family: var(--mono); }
  .kv dd { margin: 0; font-family: var(--mono); }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
          justify-content: center; z-index: 50; }
  #gate .card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px;
                padding: 1.6rem; width: 340px; }
  .pill { font-size: .68rem; border: 1px solid var(--border); border-radius: 99px; padding: .05rem .5rem;
          color: var(--fg-muted); font-family: var(--mono); }
</style>
</head>
<body>
<div id="gate" x-show="!authed" x-cloak>
  <div class="card">
    <div class="brand mono" style="margin-bottom:.6rem">ohmypi <span style="color:var(--accent)">gateway</span></div>
    <p class="muted" style="font-size:.82rem">Paste the gateway token (~/projects/ohmypi-gateway/auth-token).</p>
    <input type="password" x-model="tokenInput" placeholder="token" style="width:100%">
    <p class="faint" x-show="gateError" style="color:var(--red);font-size:.78rem" x-text="gateError"></p>
    <button class="primary" style="margin-top:.6rem;width:100%" @click="unlock()">Unlock</button>
  </div>
</div>

<div id="app" x-data="gw()" x-init="init()" x-show="authed">
  <aside>
    <header>
      <div class="brand">ohmypi <span>&gt;_</span></div>
      <div class="s faint mono" x-text="system.gateway ? 'gateway v'+system.gateway.version+' · omp v'+system.omp.version : '…'"></div>
    </header>
    <div class="scroll">
      <div class="sect">
        <h4>Actions</h4>
        <button class="primary" style="width:100%" @click="newSession = !newSession">+ New session</button>
        <div x-show="newSession" style="margin-top:.5rem;display:grid;gap:.4rem">
          <input placeholder="cwd (default ~)" x-model="ns.cwd">
          <input placeholder="model (optional)" x-model="ns.model">
          <select x-model="ns.thinking">
            <option value="">thinking: default</option>
            <option>off</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option>
          </select>
          <select x-model="ns.approvalMode">
            <option value="yolo">approval: yolo</option>
            <option value="write">approval: write</option>
            <option value="always-ask">approval: always-ask</option>
          </select>
          <button class="primary" @click="createSession()">Spawn</button>
        </div>
      </div>
      <div class="sect">
        <h4>Live sessions</h4>
        <template x-if="!live.length"><div class="faint" style="font-size:.8rem;padding:.2rem .4rem">none running</div></template>
        <template x-for="s in live" :key="s.gwId">
          <div class="item" :class="active===s.gwId && 'active'" @click="openLive(s)">
            <div class="t"><span class="dot" :class="s.exited ? 'dead':'live'"></span>
              <span x-text="s.ompSessionName || s.cwd.split('/').pop() || s.cwd"></span></div>
            <div class="s" x-text="(s.model?.id || s.model || '?') + ' · ' + (s.cwd)"></div>
          </div>
        </template>
      </div>
      <div class="sect">
        <h4>Saved sessions</h4>
        <template x-for="f in saved.slice(0,40)" :key="f.file">
          <div class="item" @click="resumeSaved(f)">
            <div class="t"><span class="dot saved"></span><span x-text="f.title || f.cwdFolder"></span></div>
            <div class="s" x-text="new Date(f.mtime*1000).toLocaleString() + ' · ' + (f.sizeBytes/1024).toFixed(0)+'kb'"></div>
          </div>
        </template>
      </div>
    </div>
  </aside>

  <main>
    <nav class="tabs">
      <button :class="tab==='chat' && 'active'" @click="tab='chat'">Chat</button>
      <button :class="tab==='inspect' && 'active'" @click="tab='inspect'; refreshInspect()">Session</button>
      <button :class="tab==='config' && 'active'" @click="tab='config'; loadConfig()">Config</button>
      <button :class="tab==='skills' && 'active'" @click="tab='skills'; loadSkills()">Skills</button>
      <button :class="tab==='models' && 'active'" @click="tab='models'; loadModels()">Models</button>
      <button :class="tab==='usage' && 'active'" @click="tab='usage'; loadUsage()">Usage</button>
      <span style="flex:1"></span>
      <span class="pill" x-show="active && wsOpen" style="border-color:#2ea04366;color:var(--accent)">streaming</span>
      <span class="pill" x-show="active && !wsOpen">ws off</span>
    </nav>

    <!-- CHAT -->
    <section class="pane noscroll" x-show="tab==='chat'">
      <template x-if="!active"><div class="faint" style="padding:2rem">Spawn or open a session to chat.</div></template>
      <template x-if="active">
        <div style="display:flex;flex-direction:column;height:100%">
          <div class="row" style="padding:.2rem 0 .5rem">
            <span class="mono muted" style="font-size:.76rem" x-text="activeInfo()"></span>
            <span style="flex:1"></span>
            <button @click="doAbort()" :disabled="!streaming">Abort</button>
            <button @click="doCompact()">Compact</button>
            <select x-model="chatThinking" @change="setThinking()" style="font-size:.78rem">
              <option value="">thinking…</option>
              <option>off</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option>
            </select>
          </div>
          <div id="chatlog">
            <template x-for="(m,i) in chat" :key="i">
              <div class="msg" :class="m.kind">
                <div class="who" x-text="m.who"></div>
                <div class="body" x-text="m.text"></div>
              </div>
            </template>
            <div class="streaming" x-show="streaming">● agent working…</div>
          </div>
          <div class="composer">
            <textarea x-model="draft" @keydown.enter.prevent="if(!$event.shiftKey) send()" placeholder="prompt  (enter to send, shift+enter newline)"></textarea>
            <button class="primary" @click="send()" :disabled="!draft.trim()">Send</button>
            <button @click="sendSteer()" :disabled="!draft.trim() || !streaming" title="Steer the running turn">Steer</button>
          </div>
        </div>
      </template>
    </section>

    <!-- INSPECT -->
    <section class="pane" x-show="tab==='inspect'">
      <template x-if="!active"><div class="faint">No session selected.</div></template>
      <div x-show="active">
        <h3 style="margin-top:0">State</h3>
        <dl class="kv">
          <template x-for="[k,v] in Object.entries(inspect.state || {})" :key="k">
            <template x-if="typeof v !== 'object' || v === null">
              <><dt x-text="k"></dt><dd x-text="String(v)"></dd></>
            </template>
          </template>
        </dl>
        <h3>Info</h3>
        <dl class="kv">
          <template x-for="[k,v] in Object.entries(inspect.info || {})" :key="k">
            <template x-if="typeof v !== 'object' || v === null">
              <><dt x-text="k"></dt><dd x-text="String(v)"></dd></>
            </template>
          </template>
        </dl>
        <h3>Messages</h3>
        <button @click="refreshInspect()">Reload</button>
        <pre class="raw" style="margin-top:.5rem" x-text="inspect.messages || '(none)'"></pre>
      </div>
    </section>

    <!-- CONFIG -->
    <section class="pane" x-show="tab==='config'">
      <div class="row" style="margin-bottom:.5rem">
        <button class="primary" @click="saveConfig()">Save config.yml</button>
        <span class="faint" style="font-size:.78rem" x-text="configMsg"></span>
      </div>
      <textarea x-model="configRaw" style="width:100%;height:70vh" spellcheck="false"></textarea>
    </section>

    <!-- SKILLS -->
    <section class="pane" x-show="tab==='skills'">
      <template x-for="s in skills" :key="s.name">
        <div class="item" style="cursor:default">
          <div class="t mono" x-text="s.name"></div>
          <div class="s" x-text="s.description"></div>
        </div>
      </template>
    </section>

    <!-- MODELS -->
    <section class="pane" x-show="tab==='models'">
      <div class="row" style="margin-bottom:.5rem">
        <input placeholder="filter (e.g. kimi)" x-model="modelQuery" @keydown.enter="loadModels()">
        <button @click="loadModels()">Search</button>
      </div>
      <pre class="raw" x-text="modelsRaw"></pre>
    </section>

    <!-- USAGE -->
    <section class="pane" x-show="tab==='usage'">
      <pre class="raw" x-text="usageRaw"></pre>
    </section>
  </main>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
function gw() {
  return {
    authed: false, token: localStorage.getItem('ompGwToken') || '',
    tokenInput: '', gateError: '',
    system: {}, live: [], saved: [],
    active: null, ws: null, wsOpen: false,
    chat: [], draft: '', streaming: false, chatThinking: '',
    tab: 'chat', newSession: false,
    ns: { cwd: '', model: '', thinking: '', approvalMode: 'yolo' },
    configRaw: '', configMsg: '', skills: [], modelsRaw: '', modelQuery: '',
    usageRaw: '', inspect: {},
    msgIdMap: {},

    async api(path, opts = {}) {
      opts.headers = Object.assign({ 'Authorization': 'Bearer ' + this.token,
        'Content-Type': 'application/json' }, opts.headers || {});
      const r = await fetch(path, opts);
      if (r.status === 401) { this.authed = false; throw new Error('unauthorized'); }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
      return r.json();
    },

    async init() {
      if (this.tokenInput || this.token) { try { await this.unlock(); return; } catch (e) {} }
    },
    async unlock() {
      this.token = this.tokenInput || this.token;
      try {
        const h = await this.api('/api/health');
        localStorage.setItem('ompGwToken', this.token);
        this.authed = true; this.gateError = '';
        await this.boot();
      } catch (e) { this.gateError = 'Token rejected: ' + e.message; }
    },
    async boot() {
      await this.refreshSessions();
      this.loadSystem();
      setInterval(() => this.refreshSessions(), 5000);
    },
    async loadSystem() { try { this.system = await this.api('/api/system'); } catch (e) {} },
    async refreshSessions() {
      try {
        const d = await this.api('/api/sessions?include_saved=true&limit=60');
        this.live = d.live; this.saved = d.saved;
      } catch (e) {}
    },
    activeInfo() {
      const s = this.live.find(x => x.gwId === this.active);
      if (!s) return this.active;
      return s.cwd + ' · ' + (s.model?.id || s.model || '?') + ' · approval ' + s.approvalMode;
    },

    async createSession() {
      try {
        const body = { approvalMode: this.ns.approvalMode };
        if (this.ns.cwd) body.cwd = this.ns.cwd;
        if (this.ns.model) body.model = this.ns.model;
        if (this.ns.thinking) body.thinking = this.ns.thinking;
        const s = await this.api('/api/sessions', { method: 'POST', body: JSON.stringify(body) });
        this.newSession = false; this.ns.model = ''; this.ns.thinking = '';
        await this.refreshSessions(); this.openLive(s);
      } catch (e) { alert('spawn failed: ' + e.message); }
    },
    async resumeSaved(f) {
      this.ns.cwd = ''; // resume keeps original cwd via -r path
      try {
        const s = await this.api('/api/sessions', { method: 'POST',
          body: JSON.stringify({ resumeFrom: f.file, approvalMode: 'yolo' }) });
        await this.refreshSessions(); this.openLive(s);
      } catch (e) { alert('resume failed: ' + e.message); }
    },

    async openLive(s) {
      this.active = s.gwId; this.tab = 'chat'; this.chat = []; this.msgIdMap = {};
      this.connectWs();
      try {
        const d = await this.api('/api/sessions/' + this.active + '/messages');
        for (const m of (d.messages || [])) this.renderHistoryMessage(m);
        const st = await this.api('/api/sessions/' + this.active + '/state');
        this.chatThinking = st.thinkingLevel || '';
      } catch (e) {}
      this.scrollChat();
    },
    renderHistoryMessage(m) {
      const role = m.role;
      let text = '';
      if (typeof m.content === 'string') text = m.content;
      else if (Array.isArray(m.content)) text = m.content
        .filter(c => c.type === 'text').map(c => c.text).join('');
      if (!text) {
        const tools = (m.content || []).filter(c => c.type === 'toolCall' || c.type === 'tool_use');
        if (tools.length) this.chat.push({ kind: 'tool', who: role, text: tools.map(t => t.name + '(…)').join(', ') });
        return;
      }
      if (role === 'user' || role === 'assistant')
        this.chat.push({ kind: role, who: role, text });
      else
        this.chat.push({ kind: 'tool', who: role, text });
    },

    connectWs() {
      if (this.ws) { try { this.ws.close(); } catch (e) {} }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      this.ws = new WebSocket(`${proto}://${location.host}/omp-ws/${this.active}?token=${encodeURIComponent(this.token)}`);
      this.ws.onopen = () => { this.wsOpen = true; };
      this.ws.onclose = () => { this.wsOpen = false; };
      this.ws.onmessage = (ev) => {
        let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
        this.handleEvent(d.event);
      };
    },
    handleEvent(e) {
      if (!e || !e.type) return;
      if (e.type === 'message_update') {
        const m = e.message || {};
        if (m.role === 'assistant' && m.id) {
          let text = '';
          for (const c of (m.content || [])) if (c.type === 'text') text += c.text;
          if (text) {
            if (!this.msgIdMap[m.id]) {
              this.msgIdMap[m.id] = this.chat.push({ kind: 'assistant', who: 'assistant', text }) - 1;
            } else {
              this.chat[this.msgIdMap[m.id]].text = text;
            }
            this.streaming = true; this.scrollChat();
          }
        }
      } else if (e.type === 'agent_start') {
        this.streaming = true;
      } else if (e.type === 'agent_end') {
        this.streaming = false; this.refreshSessions();
      } else if (e.type === 'tool_execution_start' || e.type === 'tool_call') {
        const name = e.name || e.toolName || (e.call && e.call.name) || 'tool';
        this.chat.push({ kind: 'tool', who: 'tool', text: '→ ' + name + ' ' + JSON.stringify(e.args || e.arguments || e.input || '').slice(0, 160) });
        this.scrollChat();
      }
    },
    scrollChat() { requestAnimationFrame(() => { const el = document.getElementById('chatlog'); if (el) el.scrollTop = el.scrollHeight; }); },

    async send(steer = false) {
      if (!this.draft.trim()) return;
      const message = this.draft; this.draft = '';
      this.chat.push({ kind: 'user', who: 'you', text: message });
      this.scrollChat();
      try {
        await this.api('/api/sessions/' + this.active + '/prompt', {
          method: 'POST', body: JSON.stringify({ message, steer, wait: false }) });
      } catch (e) { this.chat.push({ kind: 'tool', who: 'error', text: e.message }); }
    },
    sendSteer() { this.send(true); },
    async doAbort() { try { await this.api('/api/sessions/' + this.active + '/abort', { method: 'POST' }); } catch (e) {} },
    async doCompact() { try { await this.api('/api/sessions/' + this.active + '/compact', { method: 'POST', body: '{}' }); } catch (e) { alert(e.message); } },
    async setThinking() {
      if (!this.chatThinking) return;
      try { await this.api('/api/sessions/' + this.active + '/thinking',
        { method: 'POST', body: JSON.stringify({ level: this.chatThinking }) }); } catch (e) {}
    },

    async loadConfig() {
      this.configMsg = '';
      try { const d = await this.api('/api/config'); this.configRaw = d.raw; }
      catch (e) { this.configMsg = e.message; }
    },
    async saveConfig() {
      try {
        await this.api('/api/config', { method: 'PUT', body: this.configRaw,
          headers: { 'Content-Type': 'text/plain' } });
        this.configMsg = 'saved · omp accepted it';
      } catch (e) { this.configMsg = 'failed: ' + e.message; }
    },
    async loadSkills() { try { this.skills = (await this.api('/api/skills')).installed; } catch (e) {} },
    async loadModels() {
      try { this.modelsRaw = (await this.api('/api/models' + (this.modelQuery ? '?q=' + encodeURIComponent(this.modelQuery) : ''))).raw; }
      catch (e) { this.modelsRaw = e.message; }
    },
    async loadUsage() {
      try { const d = await this.api('/api/usage'); this.usageRaw = d.raw || d.error || '(empty)'; }
      catch (e) { this.usageRaw = e.message; }
    },
    async refreshInspect() {
      if (!this.active) return;
      try {
        const info = await this.api('/api/sessions/' + this.active);
        const state = await this.api('/api/sessions/' + this.active + '/state');
        const msgs = await this.api('/api/sessions/' + this.active + '/messages');
        this.inspect = { info, state, messages: (msgs.messages || []).map(m =>
          (m.role || '?') + ': ' + (typeof m.content === 'string' ? m.content :
            (m.content || []).filter(c => c.type === 'text').map(c => c.text).join(' ')).slice(0, 200)
        ).join('\n---\n') };
      } catch (e) { this.inspect = { error: e.message }; }
    },
  };
}
</script>
</body>
</html>
