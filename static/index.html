<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<title>ohmypi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d1117; --bg-raised: #131a23; --bg-inset: #0a0e13;
    --border: #232c38; --border-soft: #1b2330;
    --fg: #e6edf3; --fg-muted: #9aa7b4; --fg-faint: #6b7683;
    --accent: #7ee787; --accent-dim: #2ea043; --cyan: #79c0ff; --amber: #e3b341;
    --red: #ff7b72; --violet: #d2a8ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [x-cloak] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: .92rem; }
  button { background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: .4rem .75rem; cursor: pointer; font: inherit; font-size: .85rem; }
  button:hover:not(:disabled) { border-color: var(--accent-dim); }
  button.primary { background: #16321d; border-color: #2ea04366; color: var(--accent); }
  button.danger { color: var(--red); }
  button.ghost { border-color: transparent; background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea { background: var(--bg-inset); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: .45rem .6rem; font: inherit; font-size: .88rem; min-width: 0; }
  textarea { font-family: var(--mono); }
  label { font-size: .75rem; color: var(--fg-faint); display: grid; gap: .2rem; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--fg-muted); } .faint { color: var(--fg-faint); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .err { color: var(--red); font-size: .8rem; }

  .gate { min-height: 100%; display: grid; place-items: center; padding: 1rem; }
  .card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px;
          padding: 1.5rem; width: min(360px, 100%); display: grid; gap: .7rem; }
  .brand { font-family: var(--mono); font-weight: 700; }
  .brand span { color: var(--accent); }

  .shell { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
  aside { background: var(--bg-inset); border-right: 1px solid var(--border-soft);
          display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: .8rem .9rem; border-bottom: 1px solid var(--border-soft);
                 display: flex; align-items: center; gap: .5rem; }
  aside .scroll { overflow-y: auto; flex: 1; padding: .6rem; }
  .sect { margin-bottom: 1rem; }
  .sect h4 { margin: .3rem .2rem .4rem; font-size: .68rem; text-transform: uppercase;
             letter-spacing: .08em; color: var(--fg-faint); font-weight: 600; }
  .item { display: block; width: 100%; text-align: left; padding: .45rem .55rem; border-radius: 6px;
          border: 1px solid transparent; background: transparent; margin-bottom: .15rem; }
  .item:hover { background: var(--bg-raised); }
  .item.active { background: var(--bg-raised); border-color: var(--accent-dim); }
  .item .t { font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: .7rem; color: var(--fg-faint); font-family: var(--mono);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .4rem; vertical-align: 1px; }
  .dot.live { background: var(--accent); } .dot.busy { background: var(--amber); }
  .dot.saved { background: var(--fg-faint); }
  .form { display: grid; gap: .45rem; margin-top: .5rem; padding: .6rem; border: 1px solid var(--border-soft);
          border-radius: 8px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  nav.tabs { display: flex; gap: .15rem; padding: .45rem .7rem; border-bottom: 1px solid var(--border-soft);
             background: var(--bg-inset); overflow-x: auto; align-items: center; }
  nav.tabs button { border: none; background: transparent; color: var(--fg-muted); white-space: nowrap; }
  nav.tabs button.active { background: var(--bg-raised); color: var(--fg); }
  .menu-btn { display: none; }
  .pane { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; min-height: 0; }
  .chatpane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chatbar { padding: .5rem 1rem; border-bottom: 1px solid var(--border-soft); }
  .pill { font-size: .68rem; border: 1px solid var(--border); border-radius: 99px; padding: .08rem .5rem;
          color: var(--fg-muted); font-family: var(--mono); white-space: nowrap; }
  .pill.ok { border-color: #2ea04366; color: var(--accent); }
  .pill.warn { border-color: #e3b34166; color: var(--amber); }

  #chatlog { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { margin: 0 auto .9rem; max-width: 56rem; }
  .who { font-family: var(--mono); font-size: .68rem; color: var(--fg-faint); margin-bottom: .2rem; }
  .msg.user .who { color: var(--cyan); } .msg.assistant .who { color: var(--accent); }
  .msg.user .body { background: var(--bg-raised); border: 1px solid var(--border-soft);
                    border-radius: 8px; padding: .5rem .7rem; }
  .body { white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; }
  details.thinking { margin: .2rem 0 .4rem; color: var(--fg-faint); font-size: .8rem; }
  details.thinking summary { cursor: pointer; font-family: var(--mono); font-size: .7rem; }
  details.thinking .body { border-left: 2px solid var(--border); padding-left: .6rem; margin-top: .3rem; }
  .tool { margin: 0 auto .6rem; max-width: 56rem; font-family: var(--mono); font-size: .76rem;
          background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 8px; }
  .tool summary { padding: .4rem .65rem; cursor: pointer; color: var(--violet); list-style: none;
                  display: flex; gap: .5rem; align-items: baseline; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool.error summary { color: var(--red); }
  .tool .intent { color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool pre { margin: 0; padding: .5rem .65rem; border-top: 1px solid var(--border-soft);
              white-space: pre-wrap; word-wrap: break-word; max-height: 22rem; overflow-y: auto; color: var(--fg-muted); }
  .working { max-width: 56rem; margin: 0 auto; color: var(--amber); font-size: .75rem; font-family: var(--mono); }
  .notice { max-width: 56rem; margin: 0 auto .6rem; font-size: .78rem; color: var(--fg-faint);
            font-family: var(--mono); text-align: center; }
  .composer { border-top: 1px solid var(--border-soft); padding: .7rem .8rem calc(.7rem + env(safe-area-inset-bottom));
              display: flex; gap: .5rem; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 40vh; font-family: var(--sans); font-size: .92rem; }

  pre.raw { background: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: 8px;
            padding: .8rem; overflow-x: auto; font-size: .76rem; font-family: var(--mono); white-space: pre; margin: 0; }
  table.kv { border-collapse: collapse; font-size: .82rem; width: 100%; max-width: 46rem; }
  table.kv td { padding: .25rem .6rem .25rem 0; vertical-align: top; border-bottom: 1px solid var(--border-soft); }
  table.kv td:first-child { color: var(--fg-faint); font-family: var(--mono); width: 13rem; }
  table.kv td:last-child { font-family: var(--mono); word-break: break-all; }
  h3 { font-size: .95rem; margin: 1.2rem 0 .5rem; } h3:first-child { margin-top: 0; }
  .skill { padding: .55rem 0; border-bottom: 1px solid var(--border-soft); }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--bg-raised);
           border: 1px solid var(--border); border-radius: 8px; padding: .5rem .9rem; font-size: .82rem; z-index: 40; }

  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 30;
            transform: translateX(-100%); transition: transform .18s ease; }
    aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
    .menu-btn { display: inline-block; }
    .pane { padding: .8rem; }
    #chatlog { padding: .7rem; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
<script src="/static/app.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="omp()" x-init="init()">

<div class="gate" x-show="phase === 'loading'"><span class="faint mono">…</span></div>

<div class="gate" x-show="phase === 'login'" x-cloak>
  <form class="card" @submit.prevent="login()">
    <div class="brand">ohmypi <span>&gt;_</span></div>
    <label>Gateway token
      <input type="password" x-model="tokenInput" autocomplete="current-password" required>
    </label>
    <button class="primary" type="submit" :disabled="loggingIn || !tokenInput.trim()">Sign in</button>
    <div class="err" x-show="loginError" x-text="loginError"></div>
    <div class="faint" style="font-size:.75rem">Signs this browser in for 30 days. The page never stores the token.</div>
  </form>
</div>

<div class="shell" x-show="phase === 'app'" x-cloak>
  <aside :class="drawer && 'open'" @keydown.escape.window="drawer = false">
    <header>
      <div class="grow">
        <div class="brand">ohmypi <span>&gt;_</span></div>
        <div class="faint mono" style="font-size:.68rem" x-text="system ? ('omp ' + system.omp.version + ' · gw ' + system.gateway.version) : ''"></div>
      </div>
      <button class="ghost" @click="logout()" title="Sign out" aria-label="Sign out">⏻</button>
    </header>
    <div class="scroll">
      <div class="sect">
        <button class="primary" style="width:100%" @click="showNew = !showNew" x-text="showNew ? 'Cancel' : '+ New session'"></button>
        <form class="form" x-show="showNew" @submit.prevent="spawn()">
          <label>Working directory<input placeholder="~/projects" x-model="ns.cwd"></label>
          <label>Model<input placeholder="default role" x-model="ns.model"></label>
          <label>Thinking
            <select x-model="ns.thinking"><option value="">default</option>
              <template x-for="t in THINKING"><option :value="t" x-text="t"></option></template></select>
          </label>
          <label>Approval
            <select x-model="ns.approvalMode">
              <option value="yolo">yolo (auto-approve)</option>
              <option value="write">write</option>
              <option value="always-ask">always-ask</option>
            </select>
          </label>
          <button class="primary" type="submit" :disabled="spawning" x-text="spawning ? 'Starting…' : 'Start'"></button>
        </form>
      </div>
      <div class="sect">
        <h4>Running</h4>
        <div class="faint" style="font-size:.8rem;padding:0 .3rem" x-show="!live.length">Nothing running</div>
        <template x-for="s in live" :key="s.gwId">
          <button class="item" :class="active === s.gwId && 'active'" @click="open(s.gwId)">
            <div class="t"><span class="dot" :class="s.isStreaming ? 'busy' : 'live'"></span><span x-text="liveLabel(s)"></span></div>
            <div class="s" x-text="modelLabel(s.model) + ' · ' + s.cwd"></div>
          </button>
        </template>
      </div>
      <div class="sect">
        <h4>History</h4>
        <template x-for="f in saved.slice(0, 50)" :key="f.file">
          <button class="item" @click="resume(f)" :title="f.file">
            <div class="t"><span class="dot" :class="f.running ? 'live' : 'saved'"></span><span x-text="f.title || f.cwdFolder"></span></div>
            <div class="s" x-text="ago(f.mtime) + ' · ' + f.cwdFolder"></div>
          </button>
        </template>
      </div>
    </div>
  </aside>

  <main>
    <nav class="tabs">
      <button class="menu-btn" @click="drawer = true" aria-label="Sessions">☰</button>
      <template x-for="t in TABS">
        <button :class="tab === t && 'active'" @click="go(t)" x-text="t[0].toUpperCase() + t.slice(1)"></button>
      </template>
    </nav>

    <section class="chatpane" x-show="tab === 'chat'">
      <div class="pane" x-show="!active"><p class="muted">Start a session or pick one from history.</p></div>
      <template x-if="active">
        <div class="chatpane">
          <div class="chatbar row">
            <strong class="grow" style="font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                    x-text="info ? (info.ompSessionName || info.cwd) : ''"></strong>
            <span class="pill" :class="wsState === 'live' ? 'ok' : 'warn'" x-text="wsState"></span>
            <span class="pill" x-show="info" x-text="info && modelLabel(info.model)"></span>
            <span class="pill" x-show="info && info.contextUsage" x-text="ctxLabel()"></span>
            <select x-model="thinking" @change="setThinking()" aria-label="Thinking level" style="font-size:.78rem;padding:.25rem">
              <option value="" disabled>thinking</option>
              <template x-for="t in THINKING"><option :value="t" x-text="t"></option></template>
            </select>
            <button @click="compact()">Compact</button>
            <button @click="rename()">Rename</button>
            <button class="danger" @click="stop()">Stop</button>
          </div>
          <div id="chatlog" aria-live="polite">
            <template x-for="(it, i) in items" :key="i">
              <div>
                <template x-if="it.kind === 'user'">
                  <div class="msg user"><div class="who" x-text="'you' + (it.note ? ' · ' + it.note : '')"></div><div class="body" x-text="it.text"></div></div>
                </template>
                <template x-if="it.kind === 'assistant'">
                  <div class="msg assistant">
                    <div class="who">omp</div>
                    <details class="thinking" x-show="it.thinking"><summary>thinking</summary><div class="body" x-text="it.thinking"></div></details>
                    <div class="body" x-text="it.text"></div>
                  </div>
                </template>
                <template x-if="it.kind === 'tool'">
                  <details class="tool" :class="it.error && 'error'">
                    <summary><span x-text="(it.done ? (it.error ? '✗ ' : '✓ ') : '… ') + it.name"></span>
                      <span class="intent" x-text="it.intent || it.args"></span></summary>
                    <pre x-text="(it.args ? '$ ' + it.args + '\n\n' : '') + (it.output || (it.done ? '(no output)' : 'running…'))"></pre>
                  </details>
                </template>
                <template x-if="it.kind === 'notice'"><div class="notice" x-text="it.text"></div></template>
              </div>
            </template>
            <div class="working" x-show="busy">● working… <button class="ghost" style="color:var(--red);font-size:.75rem" @click="abort()">abort</button></div>
          </div>
          <form class="composer" @submit.prevent="send()">
            <textarea x-model="draft" @keydown="keydown($event)" rows="2" aria-label="Message"
                      :placeholder="busy ? 'Steer the running turn, or queue a follow-up' : 'Message omp'"></textarea>
            <div style="display:grid;gap:.3rem">
              <button class="primary" type="submit" :disabled="!draft.trim()" x-text="busy ? 'Steer' : 'Send'"></button>
              <button type="button" x-show="busy" :disabled="!draft.trim()" @click="queue()">Queue</button>
            </div>
          </form>
        </div>
      </template>
    </section>

    <section class="pane" x-show="tab === 'session'" x-cloak>
      <p class="muted" x-show="!active">No session open.</p>
      <div x-show="active">
        <div class="row" style="margin-bottom:.6rem"><h3 class="grow" style="margin:0">State</h3><button @click="loadState()">Refresh</button></div>
        <table class="kv"><template x-for="r in stateRows" :key="r[0]"><tr><td x-text="r[0]"></td><td x-text="r[1]"></td></tr></template></table>
        <h3>Session stats</h3>
        <pre class="raw" x-text="statsRaw || '…'"></pre>
      </div>
    </section>

    <section class="pane" x-show="tab === 'config'" x-cloak>
      <div class="row" style="margin-bottom:.6rem">
        <button class="primary" @click="saveConfig()">Save</button>
        <button @click="loadConfig()">Reload</button>
        <span style="font-size:.8rem" :class="configErr ? 'err' : 'faint'" x-text="configMsg"></span>
      </div>
      <textarea x-model="configRaw" spellcheck="false" aria-label="config.yml" style="width:100%;height:calc(100dvh - 11rem)"></textarea>
    </section>

    <section class="pane" x-show="tab === 'skills'" x-cloak>
      <template x-for="s in skills" :key="s.name">
        <div class="skill"><div class="mono" x-text="s.name"></div><div class="muted" style="font-size:.82rem" x-text="s.description"></div></div>
      </template>
    </section>

    <section class="pane" x-show="tab === 'models'" x-cloak>
      <form class="row" style="margin-bottom:.6rem" @submit.prevent="loadModels()">
        <input class="grow" placeholder="filter, e.g. kimi" x-model="modelQuery"><button type="submit">Search</button>
      </form>
      <pre class="raw" x-text="modelsRaw"></pre>
    </section>

    <section class="pane" x-show="tab === 'usage'" x-cloak><pre class="raw" x-text="usageRaw"></pre></section>
  </main>
</div>

<div class="toast" x-show="toastMsg" x-text="toastMsg" x-cloak role="status"></div>
</body>
</html>
